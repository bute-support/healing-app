<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>再生</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
      <div class="app-container">

        <script src="js/vendor/lucide.min.js"></script>

        <header class="page-header">
            <button class="back-btn icon-btn" id="backPlayer">
                <i data-lucide="arrow-left"></i>
            </button>
            <h1 id="title"></h1>
            <button id="settingsBtn" class="icon-btn" aria-label="settings">
                <i data-lucide="settings"></i>
            </button>
        </header>

        <main class="detail-page">

          <div class="detail-image-wrap">
            <img id="photo" class="detail-image" playsinline>
            <div id="mixPhoto" class="detail-image hidden"></div>
          </div>

          <div class="detail-meta">
            <span id="detailTag" class="detail-tag"></span>
            <span id="detailCategory" class="detail-category"></span>
          </div>

          <h2 id="detailTitle" class="detail-title"></h2>

          <p id="subtitle" class="detail-subtitle"></p>
          <p id="description" class="detail-description"></p>

          <div class="playback-row">
            <button id="favBtn" class="icon-btn">
              <i data-lucide="heart"></i>
            </button>

            <button id="playBtn" class="playback-text-btn">
              再生
            </button>

            <button id="saveMixBtn" class="icon-btn">
              <i data-lucide="plus"></i>
            </button>
          </div>

          <div class="volume-wrap">
            <i id="volumeIconLeft" data-lucide="volume-x"></i>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.15" aria-label="音量">
              <i id="volumeIconRight" data-lucide="volume-2"></i>
            </div>

        </main>

        <div id="settingsContainer"></div>
        <div id="premiumContainer"></div>
        <div id="termsContainer"></div>

        <script type="module" src="js/pages/player.js"></script>
      </div>

      <div id="toast">
        <span id="toastText"></span>
      </div>

    </body>
</html>
